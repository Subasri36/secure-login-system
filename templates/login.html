{% extends "base.html" %}
{% block title %}Log in — Vaultline{% endblock %}
{% block content %}
<div class="center-shell">
  <div class="card">
    <div class="card__eyebrow">WELCOME BACK</div>
    <h1 style="font-size:1.6rem;">Log in</h1>
    <p class="card__lede">Enter your credentials to access your dashboard.</p>

    <form method="post" action="{{ url_for('login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn">Log in</button>
    </form>

    <div class="form-footer">Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></div>
  </div>
</div>
{% endblock %}
